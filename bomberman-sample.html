<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💣 BOMBERMAN VIBE | Explosive Arena</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1a2a1f, #0a0f0a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'VT323', 'Fira Code', monospace;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #0f1a0ccc;
            backdrop-filter: blur(6px);
            border-radius: 56px;
            padding: 20px 28px 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,200,0.1);
            border: 1px solid #5a7a3a;
        }

        .arena-wrapper {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        canvas {
            display: block;
            background-color: #1e2a1a;
            border-radius: 24px;
            box-shadow: 0 12px 28px black;
            border: 3px solid #6f8f4a;
        }

        #gameCanvas {
            cursor: pointer;
        }

        .info-panel {
            background: #10180ae6;
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 20px 28px;
            min-width: 190px;
            text-align: center;
            border: 1px solid #8ab860;
        }

        .stat-block {
            background: #00000055;
            border-radius: 28px;
            padding: 10px 18px;
            margin-bottom: 20px;
        }

        .stat-label {
            color: #d4ecb2;
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .stat-value {
            font-size: 2.8rem;
            font-weight: bold;
            color: #f5cb5c;
            text-shadow: 0 0 6px #ffa41e;
            line-height: 1;
            font-family: monospace;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.8rem;
        }

        .ctrl-row {
            background: #1a2816;
            padding: 6px 12px;
            border-radius: 48px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        kbd {
            background: #2c3e2a;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: bold;
            color: #ffeaaf;
            font-size: 0.9rem;
            box-shadow: inset 0 1px 0 #6f8f5a, 0 2px 0 #0e1a0a;
        }

        button {
            background: #c97e2a;
            border: none;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
            padding: 8px 18px;
            border-radius: 60px;
            margin-top: 16px;
            cursor: pointer;
            color: #1f2a0a;
            transition: 0.05s linear;
            box-shadow: 0 5px 0 #7a4411;
            width: 100%;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #7a4411;
        }

        .status {
            margin-top: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #00000099;
            border-radius: 2rem;
            padding: 8px;
            color: #facc15;
        }

        @media (max-width: 780px) {
            .game-container { padding: 12px; }
            .stat-value { font-size: 2rem; }
            kbd { padding: 2px 8px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="arena-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="info-panel">
            <div class="stat-block">
                <div class="stat-label">💥 SCORE</div>
                <div class="stat-value" id="scoreValue">0</div>
            </div>
            <div class="stat-block">
                <div class="stat-label">❤️ LIVES</div>
                <div class="stat-value" id="livesValue">3</div>
            </div>
            <div class="stat-block">
                <div class="stat-label">💣 BOMBS</div>
                <div class="stat-value" id="bombCount">1</div>
            </div>
            <div class="controls">
                <div class="ctrl-row">🎮 <kbd>WASD</kbd> or <kbd>◀ ▶ ▲ ▼</kbd></div>
                <div class="ctrl-row"><kbd>SPACE</kbd> or <kbd>B</kbd> → PLANT BOMB</div>
                <div class="ctrl-row"><kbd>R</kbd> RESTART</div>
            </div>
            <button id="resetBtn">💣 NEW GAME</button>
            <div class="status" id="gameStatus">⚡ BLAST MODE</div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- BOMBERMAN ARENA ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 800, H = 600;
        
        // Grid settings: 15x11 cells (approx 50x50 blocks)
        const CELL_SIZE = 50;
        const MAP_W = 15;   // 15*50 = 750px
        const MAP_H = 11;   // 11*50 = 550px (centered in canvas)
        const OFFSET_X = (W - (MAP_W * CELL_SIZE)) / 2;
        const OFFSET_Y = (H - (MAP_H * CELL_SIZE)) / 2;
        
        // tile types
        const TILE_EMPTY = 0;
        const TILE_WALL = 1;      // indestructible border
        const TILE_BRICK = 2;     // destructible
        const TILE_BOMB = 3;
        const TILE_FIRE = 4;
        
        // map data
        let map = Array(MAP_H).fill().map(() => Array(MAP_W).fill(TILE_EMPTY));
        
        // Bomber
        let bomber = {
            x: 1, y: 1,
            hp: 3,
            invincibleTimer: 0,
            bombPower: 2,    // explosion radius
            maxBombs: 1,
            activeBombs: 0
        };
        
        let score = 0;
        let gameActive = true;
        let enemies = [];
        let bombs = [];      // {x, y, timer, power, owner}
        
        // powerups (simple)
        let powerups = [];
        
        // helper functions
        function buildMap() {
            // reset empty
            for(let i=0; i<MAP_H; i++){
                for(let j=0; j<MAP_W; j++){
                    if(i===0 || i===MAP_H-1 || j===0 || j===MAP_W-1) map[i][j] = TILE_WALL;
                    else map[i][j] = TILE_EMPTY;
                }
            }
            // add bricks pattern (classic bomberman)
            for(let i=2; i<MAP_H-2; i+=2){
                for(let j=2; j<MAP_W-2; j+=2){
                    if(map[i][j] === TILE_EMPTY && !(i===1 && j===1)) map[i][j] = TILE_BRICK;
                }
            }
            // extra random bricks for fun, but not blocking start zone
            for(let i=0; i<70; i++){
                let x = 1 + Math.floor(Math.random() * (MAP_W-2));
                let y = 1 + Math.floor(Math.random() (MAP_H-2));
                if( (y===1 && x===1) || (y===1 && x===2) || (y===2 && x===1) ) continue;
                if(map[y][x] === TILE_EMPTY && Math.random()<0.6) map[y][x] = TILE_BRICK;
            }
            // ensure start area free
            map[1][1] = TILE_EMPTY;
            map[1][2] = TILE_EMPTY;
            map[2][1] = TILE_EMPTY;
        }
        
        // enemies (simple moving blob)
        class Enemy {
            constructor(x,y){
                this.x = x;
                this.y = y;
                this.dirX = (Math.random() > 0.5 ? 1 : -1);
                this.dirY = 0;
                this.speed = 0.7;
                this.alive = true;
                this.timer = 0;
            }
            update(){
                if(!this.alive) return;
                this.timer++;
                // change direction sometimes
                if(this.timer > 45){
                    this.timer = 0;
                    let rd = Math.floor(Math.random()*4);
                    if(rd===0){ this.dirX=1; this.dirY=0; }
                    else if(rd===1){ this.dirX=-1; this.dirY=0; }
                    else if(rd===2){ this.dirX=0; this.dirY=1; }
                    else { this.dirX=0; this.dirY=-1; }
                }
                let newX = this.x + this.dirX * this.speed;
                let newY = this.y + this.dirY * this.speed;
                if(canMoveToTile(newX, newY, false)) {
                    this.x = newX;
                    this.y = newY;
                } else {
                    this.dirX *= -0.7;
                    this.dirY *= -0.7;
                }
                // clamp within map bounds
                this.x = Math.min(Math.max(this.x, 1.2), MAP_W-1.2);
                this.y = Math.min(Math.max(this.y, 1.2), MAP_H-1.2);
            }
            draw(){
                if(!this.alive) return;
                const cx = OFFSET_X + this.x * CELL_SIZE;
                const cy = OFFSET_Y + this.y * CELL_SIZE;
                ctx.fillStyle = "#b03f2f";
                ctx.shadowBlur = 3;
                ctx.fillRect(cx+4, cy+6, CELL_SIZE-8, CELL_SIZE-12);
                ctx.fillStyle = "#e06740";
                ctx.fillRect(cx+8, cy+12, 8, 8);
                ctx.fillRect(cx+CELL_SIZE-16, cy+12, 8, 8);
                ctx.fillStyle = "#000";
                ctx.fillRect(cx+10, cy+28, 6, 6);
                ctx.fillRect(cx+CELL_SIZE-16, cy+28, 6, 6);
                ctx.fillStyle = "#f7b05e";
                ctx.fillRect(cx+18, cy+8, 12, 8);
                ctx.shadowBlur = 0;
            }
        }
        
        function canMoveToTile(px, py, isPlayer){
            let gridX = Math.floor(px);
            let gridY = Math.floor(py);
            if(gridX<0 || gridY<0 || gridX>=MAP_W || gridY>=MAP_H) return false;
            let tile = map[gridY][gridX];
            if(tile === TILE_WALL || tile === TILE_BRICK) return false;
            if(tile === TILE_BOMB && isPlayer) return false;
            for(let b of bombs){
                if(Math.floor(b.x)===gridX && Math.floor(b.y)===gridY && isPlayer) return false;
            }
            return true;
        }
        
        // plant bomb at bomber's cell
        function plantBomb(){
            if(!gameActive) return false;
            if(bomber.activeBombs >= bomber.maxBombs) return false;
            let bx = Math.round(bomber.x);
            let by = Math.round(bomber.y);
            if(map[by][bx] === TILE_BOMB) return false;
            bombs.push({
                x: bx, y: by,
                timer: 90,     // frames until explode
                power: bomber.bombPower,
                owner: "player"
            });
            bomber.activeBombs++;
            map[by][bx] = TILE_BOMB;
            return true;
        }
        
        // explode bomb at index
        function explodeBomb(idx){
            let bomb = bombs[idx];
            if(!bomb) return;
            let bx = bomb.x, by = bomb.y;
            // remove bomb from map tile if still bomb
            if(map[by][bx] === TILE_BOMB) map[by][bx] = TILE_EMPTY;
            // explosion cells
            let fireCells = [{x:bx, y:by}];
            for(let dir of [[1,0],[-1,0],[0,1],[0,-1]]){
                for(let r=1; r<=bomb.power; r++){
                    let nx = bx + dir[0]*r;
                    let ny = by + dir[1]*r;
                    if(nx<0 || ny<0 || nx>=MAP_W || ny>=MAP_H) break;
                    let tile = map[ny][nx];
                    if(tile === TILE_WALL) break;
                    fireCells.push({x:nx, y:ny});
                    if(tile === TILE_BRICK) {
                        // brick destroyed, stop explosion range
                        map[ny][nx] = TILE_EMPTY;
                        // chance to drop powerup
                        if(Math.random()<0.25){
                            powerups.push({x:nx, y:ny, type: 'bombup'});
                        } else if(Math.random()<0.2){
                            powerups.push({x:nx, y:ny, type: 'fireup'});
                        }
                        break;
                    }
                    if(tile === TILE_BOMB) {
                        // chain reaction: find bomb index and schedule explode soon
                        for(let i=0;i<bombs.length;i++){
                            if(bombs[i].x === nx && bombs[i].y === ny){
                                bombs[i].timer = 1; // instant explode next update
                            }
                        }
                        break;
                    }
                }
            }
            // mark fire cells temporarly for damage and draw
            for(let cell of fireCells){
                // damage enemies
                for(let i=0;i<enemies.length;i++){
                    let e = enemies[i];
                    if(e.alive && Math.floor(e.x)===cell.x && Math.floor(e.y)===cell.y){
                        e.alive = false;
                        score += 100;
                        updateUI();
                    }
                }
                // damage bomber
                let bomberGrid = {x:Math.round(bomber.x), y:Math.round(bomber.y)};
                if(bomberGrid.x === cell.x && bomberGrid.y === cell.y && bomber.invincibleTimer <=0){
                    bomber.hp--;
                    updateUI();
                    if(bomber.hp <= 0){
                        gameActive = false;
                        bomber.hp = 0;
                        updateUI();
                        document.getElementById('gameStatus').innerText = '💀 GAME OVER 💀';
                    } else {
                        bomber.invincibleTimer = 40;
                        // knockback bomber away from explosion
                        bomber.x = Math.min(Math.max(bomber.x, 2), MAP_W-2);
                        bomber.y = Math.min(Math.max(bomber.y, 2), MAP_H-2);
                    }
                }
            }
            // remove bomb after explosion, decrease active count
            bomber.activeBombs = Math.max(0, bomber.activeBombs-1);
            bombs.splice(idx,1);
        }
        
        // update bombs timers
        function updateBombs(){
            for(let i=0;i<bombs.length;i++){
                bombs[i].timer--;
                if(bombs[i].timer <= 0){
                    explodeBomb(i);
                    i--; // adjust index after splice
                }
            }
        }
        
        // update powerups collection
        function updatePowerups(){
            for(let i=0;i<powerups.length;i++){
                let p = powerups[i];
                let bomberX = Math.round(bomber.x);
                let bomberY = Math.round(bomber.y);
                if(p.x === bomberX && p.y === bomberY){
                    if(p.type === 'bombup'){
                        bomber.maxBombs = Math.min(bomber.maxBombs+1, 5);
                        score += 50;
                    } else if(p.type === 'fireup'){
                        bomber.bombPower = Math.min(bomber.bombPower+1, 5);
                        score += 50;
                    }
                    powerups.splice(i,1);
                    i--;
                    updateUI();
                }
            }
        }
        
        function updateUI(){
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('livesValue').innerText = bomber.hp;
            document.getElementById('bombCount').innerText = bomber.maxBombs - bomber.activeBombs;
        }
        
        // movement + collision
        function updatePlayer(){
            if(!gameActive) return;
            if(bomber.invincibleTimer > 0) bomber.invincibleTimer--;
            let moveX = 0, moveY = 0;
            if(keys.ArrowLeft || keys.KeyA) moveX = -1;
            if(keys.ArrowRight || keys.KeyD) moveX = 1;
            if(keys.ArrowUp || keys.KeyW) moveY = -1;
            if(keys.ArrowDown || keys.KeyS) moveY = 1;
            
            let speed = 3.2;
            if(moveX !==0 && moveY !==0) speed *= 0.72;
            let newX = bomber.x + moveX * 0.12;
            let newY = bomber.y + moveY * 0.12;
            let canX = canMoveToTile(newX, bomber.y, true);
            let canY = canMoveToTile(bomber.x, newY, true);
            if(canX) bomber.x = newX;
            if(canY) bomber.y = newY;
            // clamp float grid
            bomber.x = Math.min(Math.max(bomber.x, 0.8), MAP_W-0.8);
            bomber.y = Math.min(Math.max(bomber.y, 0.8), MAP_H-0.8);
        }
        
        // enemies update + collision with bomber
        function updateEnemies(){
            for(let e of enemies){
                e.update();
                if(e.alive && Math.floor(e.x)===Math.round(bomber.x) && Math.floor(e.y)===Math.round(bomber.y) && bomber.invincibleTimer<=0 && gameActive){
                    bomber.hp--;
                    updateUI();
                    if(bomber.hp <=0){
                        gameActive = false;
                        document.getElementById('gameStatus').innerText = '💀 GAME OVER 💀';
                    } else {
                        bomber.invincibleTimer = 35;
                        bomber.x = 1;
                        bomber.y = 1;
                    }
                }
            }
        }
        
        // initialize enemies
        function spawnEnemies(){
            enemies = [];
            let enemyPositions = [[3,3],[MAP_W-4,3],[5,MAP_H-3],[MAP_W-5,MAP_H-4],[8,5],[MAP_W-6,6]];
            for(let pos of enemyPositions){
                if(map[pos[1]][pos[0]] !== TILE_WALL && map[pos[1]][pos[0]] !== TILE_BRICK){
                    enemies.push(new Enemy(pos[0], pos[1]));
                }
            }
            if(enemies.length<3){
                enemies.push(new Enemy(5,5));
                enemies.push(new Enemy(10,7));
            }
        }
        
        // reset full game
        function resetGame(){
            buildMap();
            bomber = {
                x: 1, y: 1,
                hp: 3,
                invincibleTimer: 0,
                bombPower: 2,
                maxBombs: 1,
                activeBombs: 0
            };
            score = 0;
            gameActive = true;
            bombs = [];
            powerups = [];
            bomber.activeBombs = 0;
            spawnEnemies();
            updateUI();
            document.getElementById('gameStatus').innerText = '💥 BOMB MANIA';
        }
        
        // ---------- DRAW EVERYTHING (Stylish retro) ----------
        function drawMap() {
            for(let row=0; row<MAP_H; row++){
                for(let col=0; col<MAP_W; col++){
                    let x = OFFSET_X + col*CELL_SIZE;
                    let y = OFFSET_Y + row*CELL_SIZE;
                    let tile = map[row][col];
                    if(tile === TILE_WALL){
                        ctx.fillStyle = "#5a5a3a";
                        ctx.fillRect(x,y,CELL_SIZE-1,CELL_SIZE-1);
                        ctx.fillStyle = "#7e7a52";
                        ctx.fillRect(x+4,y+4,CELL_SIZE-9,CELL_SIZE-9);
                    } else if(tile === TILE_BRICK){
                        ctx.fillStyle = "#b87c4f";
                        ctx.fillRect(x,y,CELL_SIZE-1,CELL_SIZE-1);
                        ctx.fillStyle = "#9b5e2e";
                        ctx.fillRect(x+6,y+4,CELL_SIZE-12,12);
                        ctx.fillRect(x+4,y+20,CELL_SIZE-10,12);
                    } else if(tile === TILE_BOMB){
                        ctx.fillStyle = "#2a2a2a";
                        ctx.beginPath();
                        ctx.arc(x+CELL_SIZE/2, y+CELL_SIZE/2, 12, 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = "#ff5e00";
                        ctx.fillRect(x+15, y+18, 8, 12);
                        ctx.fillStyle = "#ffaa44";
                        ctx.fillRect(x+18, y+12, 4, 8);
                    } else {
                        ctx.fillStyle = "#2a412a";
                        ctx.fillRect(x,y,CELL_SIZE-1,CELL_SIZE-1);
                        ctx.fillStyle = "#426a3a";
                        ctx.fillRect(x+2,y+2,CELL_SIZE-5,CELL_SIZE-5);
                    }
                }
            }
        }
        
        function drawBomber(){
            let x = OFFSET_X + bomber.x*CELL_SIZE;
            let y = OFFSET_Y + bomber.y*CELL_SIZE;
            if(bomber.invincibleTimer>0 && (Math.floor(Date.now()/60)%3===0)){
                ctx.globalAlpha = 0.5;
            }
            ctx.fillStyle = "#f5c542";
            ctx.fillRect(x+8,y+6,CELL_SIZE-16,CELL_SIZE-14);
            ctx.fillStyle = "#dd8822";
            ctx.fillRect(x+12,y+20,10,18);
            ctx.fillRect(x+CELL_SIZE-22,y+20,10,18);
            ctx.fillStyle = "#2a2a44";
            ctx.fillRect(x+16,y+28,6,14);
            ctx.fillRect(x+CELL_SIZE-22,y+28,6,14);
            ctx.fillStyle = "#fff0c0";
            ctx.fillRect(x+12,y+12,8,8);
            ctx.fillRect(x+CELL_SIZE-20,y+12,8,8);
            ctx.fillStyle = "#000";
            ctx.fillRect(x+14,y+18,4,4);
            ctx.fillRect(x+CELL_SIZE-18,y+18,4,4);
            ctx.globalAlpha = 1;
        }
        
        function drawPowerups() {
            for(let p of powerups){
                let x = OFFSET_X + p.x*CELL_SIZE;
                let y = OFFSET_Y + p.y*CELL_SIZE;
                ctx.fillStyle = "#f5bc70";
                ctx.beginPath();
                ctx.arc(x+CELL_SIZE/2, y+CELL_SIZE/2, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#d49c3a";
                ctx.font = "bold 20px monospace";
                ctx.fillText(p.type==='bombup' ? "💣+" : "🔥+", x+12, y+34);
            }
        }
        
        function drawEffects(){
            for(let b of bombs){
                let x = OFFSET_X + b.x*CELL_SIZE;
                let y = OFFSET_Y + b.y*CELL_SIZE;
                ctx.fillStyle = "#ff6600aa";
                ctx.beginPath();
                ctx.arc(x+25, y+25, 12 + (Date.now()/30 % 8), 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        function drawUItext(){
            if(!gameActive){
                ctx.font = "bold 38monospace";
                ctx.fillStyle = "#ffcc77";
                ctx.shadowBlur = 0;
                ctx.fillText("GAME OVER", W/2-120, H/2-40);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#eee";
                ctx.fillText("press RESTART", W/2-70, H/2+30);
            }
        }
        
        // game loop
        function updateGame(){
            if(gameActive){
                updatePlayer();
                updateBombs();
                updatePowerups();
                updateEnemies();
                if(bomber.hp <= 0) gameActive = false;
            }
        }
        
        function draw(){
            ctx.clearRect(0,0,W,H);
            ctx.fillStyle = "#1b2f1a";
            ctx.fillRect(0,0,W,H);
            drawMap();
            drawPowerups();
            for(let e of enemies) e.draw();
            drawBomber();
            drawEffects();
            drawUItext();
            // additional status
            ctx.font = "bold 14px monospace";
            ctx.fillStyle = "#fad974";
            ctx.fillText("💣 BOMBERMAN · DESTROY BRICKS & ENEMIES", 20, 40);
        }
        
        // Input handling
        let keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, KeyA: false, KeyD: false, KeyW: false, KeyS: false };
        
        function handleKeyDown(e){
            let code = e.code;
            if(keys.hasOwnProperty(code)) keys[code] = true;
            if(code === 'Space' || code === 'KeyB'){
                e.preventDefault();
                plantBomb();
            }
            if(code === 'KeyR'){
                e.preventDefault();
                resetGame();
            }
        }
        
        function handleKeyUp(e){
            let code = e.code;
            if(keys.hasOwnProperty(code)) keys[code] = false;
        }
        
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        document.getElementById('resetBtn').addEventListener('click', ()=>{
            resetGame();
            gameActive = true;
            if(bomber.hp<=0) bomber.hp=3;
            updateUI();
        });
        
        resetGame();
        setInterval(()=>{
            updateGame();
            draw();
        }, 1000/60);
    })();
</script>
