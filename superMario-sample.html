<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Super Mario Vibe Clone | Side Scroller Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0a2f4a 0%, #071a2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'VT323', monospace;
            padding: 20px;
        }

        .game-container {
            background: #1e2a3a;
            border-radius: 32px;
            padding: 20px 20px 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.1);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 18px;
            padding: 8px 20px;
            background: #000000aa;
            backdrop-filter: blur(4px);
            border-radius: 60px;
            color: #facc15;
            text-shadow: 0 2px 2px black;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .score-box, .lives-box {
            background: #2d1f00;
            padding: 5px 18px;
            border-radius: 40px;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 24px;
            margin-top: 16px;
            justify-content: center;
            font-size: 1rem;
            background: #0f172ad9;
            padding: 10px 20px;
            border-radius: 50px;
            color: #e2e8f0;
            font-weight: bold;
        }

        .controls span {
            background: #334155;
            padding: 4px 12px;
            border-radius: 28px;
            margin: 0 4px;
            font-family: monospace;
            font-size: 1.1rem;
        }

        button {
            background: #eab308;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 6px 20px;
            border-radius: 60px;
            margin-left: 20px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #92400e;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #92400e;
        }

        @media (max-width: 860px) {
            .info-panel { font-size: 1.1rem; }
            .controls { font-size: 0.75rem; gap: 12px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        <div class="info-panel">
            <div class="score-box">⭐ SCORE: <span id="scoreValue">0</span></div>
            <div class="lives-box">🍄 LIVES: <span id="livesValue">3</span></div>
            <button id="resetBtn">🌟 RESTART</button>
        </div>
        <div class="controls">
            🎮 <span>◀  ▶</span>  MOVE &nbsp;&nbsp;|&nbsp;&nbsp; <span>▲  /  SPACE</span>  JUMP &nbsp;&nbsp;|&nbsp;&nbsp; 🌟 vibe code quest
        </div>
    </div>
</div>

<script>
    (function(){
        // ----- CANVAS -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ----- GAME DIMENSIONS -----
        const W = 900, H = 500;
        const GROUND_Y = H - 55;      // platform ground level
        const GRAVITY = 0.8;
        const JUMP_POWER = -12;
        
        // ----- PLAYER -----
        let player = {
            x: 90,
            y: GROUND_Y - 48,   // height 48px
            width: 32,
            height: 48,
            vx: 0,
            vy: 0,
            onGround: true,
            facingRight: true,
            invincibleTimer: 0,   // frames of invincibility after hit
        };
        
        // ----- WORLD & PLATFORMS (simple mario-like bricks & ground)-----
        // Classic ground platform (full length)
        const platforms = [
            { x: 0, y: GROUND_Y, w: W, h: 10 },          // main ground (invisible above, collider)
            // floating brick style platforms
            { x: 200, y: GROUND_Y - 72, w: 70, h: 28 },
            { x: 420, y: GROUND_Y - 118, w: 60, h: 28 },
            { x: 640, y: GROUND_Y - 88, w: 80, h: 28 },
            { x: 760, y: GROUND_Y - 140, w: 55, h: 28 },
            { x: 50, y: GROUND_Y - 130, w: 60, h: 28 },   // left side bonus platform
            { x: 520, y: GROUND_Y - 170, w: 50, h: 28 },   // high challenge
        ];
        
        // ----- COINS (collectibles) -----
        let coins = [];
        function initCoins() {
            const coinPositions = [
                { x: 130, y: GROUND_Y - 80 },   // near start
                { x: 240, y: GROUND_Y - 108 },
                { x: 450, y: GROUND_Y - 148 },
                { x: 660, y: GROUND_Y - 118 },
                { x: 790, y: GROUND_Y - 172 },
                { x: 80, y: GROUND_Y - 165 },
                { x: 330, y: GROUND_Y - 45 },   // low coin on ground
                { x: 580, y: GROUND_Y - 60 },
                { x: 830, y: GROUND_Y - 40 },
                { x: 700, y: GROUND_Y - 200 },  // high coin on the high platform
            ];
            coins = coinPositions.map(pos => ({
                x: pos.x,
                y: pos.y,
                w: 12,
                h: 12,
                collected: false
            }));
        }
        
        // ----- ENEMIES (Goomba-like)-----
        let enemies = [];
        function initEnemies() {
            enemies = [
                { x: 280, y: GROUND_Y - 38, w: 32, h: 32, type: 'goomba', active: true, direction: -1, speed: 1.2 },
                { x: 500, y: GROUND_Y - 38, w: 32, h: 32, type: 'goomba', active: true, direction: 1, speed: 1.0 },
                { x: 720, y: GROUND_Y - 88, w: 32, h: 32, type: 'goomba', active: true, direction: -0.9, speed: 1.1 },  // on floating platform
                { x: 55, y: GROUND_Y - 130, w: 32, h: 32, type: 'goomba', active: true, direction: 0.8, speed: 0.9 },    // left platform enemy
            ];
            // adjust enemy y to match platform y positions precisely so they walk on them
            for(let e of enemies) {
                // set correct y based on which platform they belong
                if(e.x > 600 && e.x < 800) e.y = GROUND_Y - 88;   // platform at y= GROUND_Y-88
                if(e.x > 40 && e.x < 120) e.y = GROUND_Y - 130;
                if(e.x > 480 && e.x < 560) e.y = GROUND_Y - 170;
                if(e.x > 260 && e.x < 340) e.y = GROUND_Y - 38;
                if(e.x > 480 && e.x < 540) e.y = GROUND_Y - 38;
            }
        }
        
        // ----- GAME STATE -----
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let cameraX = 0;      // simple follow: player centered but clamped
        let animationFrame = null;
        
        // ----- HELPER FUNCTIONS -----
        function updateUI() {
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('livesValue').innerText = lives;
        }
        
        function resetGame() {
            gameOver = false;
            score = 0;
            lives = 3;
            player = {
                x: 90,
                y: GROUND_Y - 48,
                width: 32,
                height: 48,
                vx: 0,
                vy: 0,
                onGround: true,
                facingRight: true,
                invincibleTimer: 0,
            };
            initCoins();
            initEnemies();
            updateUI();
        }
        
        // collision: AABB
        function collides(r1, r2) {
            return !(r2.x > r1.x + r1.w ||
                r2.x + r2.w < r1.x ||
                r2.y > r1.y + r1.h ||
                r2.y + r2.h < r1.y);
        }
        
        // handle platform collisions & resolve movement
        function applyCollisionAndMovement() {
            // horizontal movement
            player.x += player.vx;
            // horizontal platform collision
            for (let plat of platforms) {
                if (collides(player, plat)) {
                    if (player.vx > 0) {
                        player.x = plat.x - player.width;
                    } else if (player.vx < 0) {
                        player.x = plat.x + plat.w;
                    }
                }
            }
            
            // vertical movement + gravity
            player.vy += GRAVITY;
            player.y += player.vy;
            player.onGround = false;
            
            // vertical collision resolution (from top & landing)
            for (let plat of platforms) {
                if (collides(player, plat)) {
                    // falling down (player.vy >=0)
                    if (player.vy >= 0 && (player.y + player.height - player.vy) <= plat.y + 12) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.onGround = true;
                    } 
                    // hitting head (upward)
                    else if (player.vy < 0) {
                        player.y = plat.y + plat.h;
                        player.vy = 0;
                    }
                }
            }
            
            // boundary constraints: left/right screen edges (world wrap-ish but we limit movement to avoid falling off world)
            if (player.x < 20) player.x = 20;
            if (player.x + player.width > W - 20) player.x = W - player.width - 20;
            
            // fall death (if y > canvas bottom)
            if (player.y + player.height > GROUND_Y + 35) {
                // fall into void
                player.y = GROUND_Y - 48;
                player.x = 90;
                player.vx = 0;
                player.vy = 0;
                loseLife();
            }
            
            // Update invincibility frames
            if (player.invincibleTimer > 0) {
                player.invincibleTimer--;
            }
        }
        
        // enemy movement & collision / stomping
        function updateEnemies() {
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (!e.active) continue;
                
                // simple AI walk back and forth (bounce on edges of screen/platforms)
                let newX = e.x + e.direction * e.speed;
                // basic edge detection: canvas bounds + platform detection (optional)
                let wouldCollide = false;
                let tempRect = {x: newX, y: e.y, w: e.w, h: e.h};
                for(let plat of platforms) {
                    if(collides(tempRect, plat)) {
                        wouldCollide = true;
                        break;
                    }
                }
                if(newX < 20 || newX + e.w > W - 20 || wouldCollide) {
                    e.direction *= -1;
                    newX = e.x + e.direction * e.speed;
                }
                e.x = newX;
                
                // enemy collision with player (only if active)
                if (!gameOver && collides(player, e)) {
                    // player stomping (vy > 0 means falling onto enemy)
                    if (player.vy > 0 && player.y + player.height - player.vy <= e.y + e.h/1.5) {
                        // stomp kill
                        e.active = false;
                        player.vy = -9;   // little bounce
                        score += 100;
                        updateUI();
                    } else {
                        // hurt player
                        if (player.invincibleTimer <= 0 && !gameOver) {
                            loseLife();
                            player.invincibleTimer = 40;  // invincibility frames
                            // knockback
                            if (player.x < e.x) player.vx = -5;
                            else player.vx = 5;
                            player.vy = -6;
                        }
                    }
                }
            }
            // remove dead enemies (optional keep array clean)
            for(let i=enemies.length-1; i>=0; i--){
                if(!enemies[i].active) enemies.splice(i,1);
            }
        }
        
        function loseLife() {
            if (gameOver) return;
            lives--;
            updateUI();
            if (lives <= 0) {
                gameOver = true;
                lives = 0;
                updateUI();
                return;
            }
            // respawn player with reset position & velocity
            player.x = 90;
            player.y = GROUND_Y - 48;
            player.vx = 0;
            player.vy = 0;
            player.invincibleTimer = 45;   // safe respawn blink
        }
        
        function updateCoins() {
            for (let i=0; i<coins.length; i++) {
                const coin = coins[i];
                if (coin.collected) continue;
                if (collides(player, {x: coin.x, y: coin.y, w: coin.w, h: coin.h})) {
                    coin.collected = true;
                    score += 25;
                    updateUI();
                }
            }
        }
        
        // dynamic camera follow
        function updateCamera() {
            let targetX = player.x + player.width/2 - W/2;
            targetX = Math.min(Math.max(targetX, 0), W - W);  // clamp to edges but keep world inside canvas
            if (targetX < 0) targetX = 0;
            if (targetX > W - W) targetX = W - W; // no extra world, just clamp left/right screen movement
            cameraX = targetX;
        }
        
        // ---- INPUT HANDLING ----
        const keys = {
            ArrowLeft: false, ArrowRight: false, ArrowUp: false, Space: false
        };
        
        function handleInput() {
            if (gameOver) return;
            let acc = 0.7;
            let maxSpeed = 5.8;
            if (keys.ArrowLeft) {
                player.vx = Math.max(player.vx - acc, -maxSpeed);
                player.facingRight = false;
            }
            if (keys.ArrowRight) {
                player.vx = Math.min(player.vx + acc, maxSpeed);
                player.facingRight = true;
            }
            // friction when no horizontal input
            if (!keys.ArrowLeft && !keys.ArrowRight) {
                player.vx *= 0.94;
            }
            
            // Jump
            if ((keys.ArrowUp || keys.Space) && player.onGround && !gameOver) {
                player.vy = JUMP_POWER;
                player.onGround = false;
            }
        }
        
        // ---------- DRAW EVERYTHING (retro mario style) ----------
        function drawBackground() {
            // sky gradient
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, "#7ec8e0");
            grad.addColorStop(0.7, "#3c99c0");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            // clouds
            ctx.fillStyle = "#f9f9ffcc";
            ctx.shadowBlur = 0;
            drawCloud(120, 70, 60);
            drawCloud(450, 50, 75);
            drawCloud(750, 100, 70);
            drawCloud(280, 130, 55);
            function drawCloud(x, y, size) {
                ctx.beginPath();
                ctx.arc(x, y, size*0.5, 0, Math.PI*2);
                ctx.arc(x+size*0.5, y-size*0.25, size*0.45, 0, Math.PI*2);
                ctx.arc(x-size*0.45, y-size*0.2, size*0.45, 0, Math.PI*2);
                ctx.fillStyle = "#f0f8ffdd";
                ctx.fill();
            }
            // ground blocks classic style
            ctx.fillStyle = "#935e38";
            ctx.fillRect(0, GROUND_Y-5, W, 12);
            ctx.fillStyle = "#bb7a45";
            for(let i=0; i<W+40; i+=40){
                ctx.fillRect(i, GROUND_Y-8, 36, 12);
            }
            ctx.fillStyle = "#6b3e1c";
            for(let i=0; i<W+40; i+=40){
                ctx.fillRect(i+4, GROUND_Y-5, 28, 7);
            }
        }
        
        function drawPlatforms() {
            for(let plat of platforms) {
                if(plat.y === GROUND_Y) continue; // ground already drawn
                // brick style
                ctx.fillStyle = "#bc7a3c";
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                ctx.fillStyle = "#9b5a2a";
                ctx.fillRect(plat.x+5, plat.y+4, plat.w-10, 6);
                ctx.fillStyle = "#d49c6c";
                for(let i=0; i<plat.w; i+=20){
                    ctx.fillRect(plat.x+i+2, plat.y+12, 14, 8);
                }
            }
        }
        
        function drawPlayer() {
            let xOff = player.x;
            let yOff = player.y;
            // invincibility blink (flashing)
            if (player.invincibleTimer > 0 && (Math.floor(Date.now()/60)%3 === 0)) {
                ctx.globalAlpha = 0.6;
            }
            // Mario like overalls
            ctx.fillStyle = "#e52525";
            ctx.fillRect(xOff, yOff, player.width, player.height);
            ctx.fillStyle = "#2545a0";
            ctx.fillRect(xOff, yOff+player.height-20, player.width, 18);
            ctx.fillStyle = "#fdcc8a";
            ctx.fillRect(xOff+6, yOff+8, 20, 16);
            ctx.fillStyle = "#000";
            ctx.fillRect(xOff+8, yOff+14, 6, 6);
            ctx.fillRect(xOff+18, yOff+14, 6, 6);
            ctx.fillStyle = "#8b5a2b";
            ctx.fillRect(xOff+12, yOff+28, 8, 10);
            ctx.fillStyle = "#3c2a1f";
            ctx.fillRect(xOff+4, yOff+38, 6, 8);
            ctx.fillRect(xOff+22, yOff+38, 6, 8);
            if (player.facingRight) {
                ctx.fillStyle = "#a55d35";
                ctx.fillRect(xOff+28, yOff+18, 8, 6);
            } else {
                ctx.fillStyle = "#a55d35";
                ctx.fillRect(xOff-4, yOff+18, 8, 6);
            }
            ctx.globalAlpha = 1;
        }
        
        function drawCoins() {
            for (let coin of coins) {
                if(coin.collected) continue;
                ctx.fillStyle = "#f5b642";
                ctx.beginPath();
                ctx.ellipse(coin.x+6, coin.y+6, 7, 8, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ffdf70";
                ctx.beginPath();
                ctx.ellipse(coin.x+6, coin.y+5, 4, 5, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#d4af37";
                ctx.font = "bold 14px monospace";
                ctx.fillText("★", coin.x+2, coin.y+10);
            }
        }
        
        function drawEnemies() {
            for (let e of enemies) {
                if(!e.active) continue;
                ctx.fillStyle = "#8b5a2b";
                ctx.fillRect(e.x, e.y, e.w, e.h);
                ctx.fillStyle = "#5d3a1a";
                ctx.fillRect(e.x+5, e.y+8, 22, 10);
                ctx.fillStyle = "#000";
                ctx.fillRect(e.x+7, e.y+18, 6, 6);
                ctx.fillRect(e.x+19, e.y+18, 6, 6);
                ctx.fillStyle = "#c97e3a";
                ctx.fillRect(e.x+12, e.y+4, 8, 8);
            }
        }
        
        function drawUItext() {
            if (gameOver) {
                ctx.font = "bold 38monospace";
                ctx.fillStyle = "#ffdd77";
                ctx.shadowBlur = 0;
                ctx.fillText("GAME OVER", W/2-120, H/2-40);
                ctx.font = "22px monospace";
                ctx.fillStyle = "white";
                ctx.fillText("press RESTART", W/2-85, H/2+30);
            }
            // extra collect tips
            ctx.font = "bold 14px monospace";
            ctx.fillStyle = "#fde047";
            ctx.shadowBlur = 0;
            ctx.fillText("⭐ VIBE CODE QUEST ⭐", W-170, 35);
        }
        
        // ----- MAIN GAME LOOP -----
        function updateGame() {
            if (!gameOver) {
                handleInput();
                applyCollisionAndMovement();
                updateEnemies();
                updateCoins();
                updateCamera();
                
                // minor level bounds: if game over due to lives = 0 inside update
                if(lives <= 0) {
                    gameOver = true;
                }
            }
        }
        
        function draw() {
            drawBackground();
            drawPlatforms();
            drawCoins();
            drawEnemies();
            drawPlayer();
            drawUItext();
            // draw floating score shadows
        }
        
        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // ---- EVENT LISTENERS ----
        function keydownHandler(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp') {
                e.preventDefault();
            }
            if (e.key === ' ' || e.key === 'Space' || e.key === 'ArrowUp') {
                e.preventDefault();
                keys.Space = true;
                keys.ArrowUp = true;
            }
            if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.key === 'ArrowRight') keys.ArrowRight = true;
        }
        
        function keyupHandler(e) {
            if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.key === 'ArrowRight') keys.ArrowRight = false;
            if (e.key === 'ArrowUp') keys.ArrowUp = false;
            if (e.key === ' ' || e.key === 'Space') {
                keys.Space = false;
                keys.ArrowUp = false;
            }
        }
        
        window.addEventListener('keydown', keydownHandler);
        window.addEventListener('keyup', keyupHandler);
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetGame();
            gameOver = false;
        });
        
        // initial setup
        resetGame();
        updateUI();
        gameLoop();
        
        // touch prevention on canvas context
        canvas.addEventListener('touchstart', (e) => e.preventDefault());
    })();
</script>
</body>
</html>
